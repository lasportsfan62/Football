<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Previous SuperContest Picks</title>

<style>

body {
    font-family: Arial, sans-serif;
    background:#f7f7f7;
    margin:0;
    padding:20px;
}

.container {
    max-width:1200px;
    margin:auto;
}


/* HEADER */

.hero {

    text-align:center;
    background:#111;
    color:white;
    padding:25px;
    border-radius:15px;
    margin-bottom:20px;

}

.hero h1 {

    margin:0;
    font-size:34px;

}

.hero p {

    margin-top:10px;
    font-size:18px;

}


/* SECTION CARDS */

.section-card {

    background:white;
    border-radius:15px;
    padding:20px;
    box-shadow:0 4px 10px rgba(0,0,0,.15);
    margin-bottom:25px;

}


.section-card h2 {

    text-align:center;

}


/* DROPDOWN */

.week-selector {

    text-align:center;
    margin-bottom:20px;

}


select {

    padding:10px;
    font-size:16px;
    border-radius:8px;

}


/* TABLE */

table {

    width:100%;
    border-collapse:collapse;

}


.table-container {

    width:100%;
    overflow-x:auto;
    -webkit-overflow-scrolling:touch;

}


th {

    background:#111;
    color:white;
    padding:12px;

}


td {

    padding:12px;
    text-align:center;
    border-bottom:1px solid #ddd;
    white-space:nowrap;

}


/* RESULT COLORS */

.win-cell {

    background:#09C90E;
    font-weight:bold;

}


.loss-cell {

    background:#FF0000;
    font-weight:bold;

}


.tie-cell {

    background:#BFBFBF;
    font-weight:bold;

}


/* MOBILE */

@media(max-width:700px){

.hero h1 {

    font-size:26px;

}


table {

    font-size:13px;

}

}

</style>

</head>


<body>


<div class="container">


<div class="hero">

<h1>🏈 Previous SuperContest Picks</h1>

<p>Review Past Weeks</p>

</div>



<div class="section-card">


<h2>📅 Select Week</h2>


<div class="week-selector">


<select id="weekSelect">

<option>Previous Weeks</option>

</select>


</div>


</div>




<div class="section-card">


<h2 id="weekTitle">Week Picks</h2>


<div class="table-container">


<table id="previousPicksTable">


<tr>

<th>Player</th>
<th>Game 1</th>
<th>Game 2</th>
<th>Game 3</th>
<th>Game 4</th>
<th>Game 5</th>
<th>Score</th>

</tr>


</table>


</div>


</div>


</div>



<script>


const archiveCSV = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSu2pSg7OEvox4uRVTT2P_XRVPSyuxq1DCuzc2kSoTPylfka-8VH1N9zFe7vLn7PUcMxL2ZYkK7H7P0/pub?gid=1538633472&single=true&output=csv";

let resultsLookup = {};

let archiveData = [];

let archiveLoaded = false;
let resultsLoaded = false;

function tryLoadArchive(){

    if(archiveLoaded && resultsLoaded){

        loadWeeks();

    }

}


fetch(archiveCSV)

.then(response => response.text())

.then(data => {


let rows = data.trim().split("\n");


// remove header row

rows.slice(1).forEach(rowText => {


let columns = rowText.split(",");


archiveData.push({

    week: Number(columns[0]),
    player: columns[1],
    game1: columns[2],
    game2: columns[3],
    game3: columns[4],
    game4: columns[5],
    game5: columns[6]

});


});


// create dropdown

archiveLoaded = true;
tryLoadArchive();


})


.catch(error => {

console.log("Unable to load archive:", error);

});

const resultsCSV = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSu2pSg7OEvox4uRVTT2P_XRVPSyuxq1DCuzc2kSoTPylfka-8VH1N9zFe7vLn7PUcMxL2ZYkK7H7P0/pub?gid=195972555&single=true&output=csv";

fetch(resultsCSV)

.then(response => response.text())

.then(data => {


let rows = data.trim().split("\n");


rows.slice(1).forEach(rowText => {


let columns = rowText.split(",");


let week = columns[0].trim();
let pick = columns[1].trim();
let result = columns[2].trim();


resultsLookup[week + "|" + pick] = result;

});

resultsLoaded = true;
tryLoadArchive();

})

.catch(error => {

console.log("Unable to load results:", error);

});

function loadWeeks(){


let weekSelect = document.getElementById("weekSelect");


// get unique weeks

let weeks = [...new Set(archiveData.map(item => item.week))];


// newest first

weeks.sort((a,b) => b-a);


// clear dropdown

weekSelect.innerHTML = "";



weeks.forEach(week => {


let option = document.createElement("option");

option.value = week;

option.textContent = "Week " + week;


weekSelect.appendChild(option);


});


// automatically display newest week

displayWeek(weeks[0]);


// update when changed

weekSelect.addEventListener("change", function(){

displayWeek(this.value);

});


}


function gradeArchivedPicks(selectedWeek){


let table = document.getElementById("previousPicksTable");

let rows = table.rows;


for(let i = 1; i < rows.length; i++){


let score = 0;


for(let j = 1; j <= 5; j++){


let cell = rows[i].cells[j];

let pick = cell.textContent.trim();


let result = resultsLookup[selectedWeek + "|" + pick];


// remove old colors

cell.classList.remove(
"win-cell",
"loss-cell",
"tie-cell"
);



if(result === "W"){

cell.classList.add("win-cell");

score += 1;

}


else if(result === "L"){

cell.classList.add("loss-cell");

}


else if(result === "T"){

cell.classList.add("tie-cell");

score += 0.5;

}


}


rows[i].cells[6].textContent = score;


}


}


function displayWeek(selectedWeek){


let table = document.getElementById("previousPicksTable");


// remove old rows except header

while(table.rows.length > 1){

table.deleteRow(1);

}



let weekTitle = document.getElementById("weekTitle");

weekTitle.textContent = "Week " + selectedWeek + " Picks";



// add matching players

archiveData

.filter(item => item.week == selectedWeek)

.forEach(player => {


let row = table.insertRow();


row.insertCell().textContent = player.player;
row.insertCell().textContent = player.game1;
row.insertCell().textContent = player.game2;
row.insertCell().textContent = player.game3;
row.insertCell().textContent = player.game4;
row.insertCell().textContent = player.game5;
row.insertCell().textContent = "0";


});

gradeArchivedPicks(selectedWeek);

}


</script>


</body>

</html>
