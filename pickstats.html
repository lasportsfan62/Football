<script>

const PREVIOUS_WEEKS_CSV =
    "https://docs.google.com/spreadsheets/d/e/2PACX-1vSu2pSg7OEvox4uRVTT2P_XRVPSyuxq1DCuzc2kSoTPylfka-8VH1N9zFe7vLn7PUcMxL2ZYkK7H7P0/pub?gid=1538633472&single=true&output=csv";

const RESULTS_CSV =
    "https://docs.google.com/spreadsheets/d/e/2PACX-1vSu2pSg7OEvox4uRVTT2P_XRVPSyuxq1DCuzc2kSoTPylfka-8VH1N9zFe7vLn7PUcMxL2ZYkK7H7P0/pub?gid=195972555&single=true&output=csv";


const playerCards = document.querySelectorAll(".player-card");
const profileDisplay = document.querySelector(".profile-display");


/* =========================
   LOAD CSV
========================= */

async function loadCSV(url){

    const response = await fetch(url);

    if(!response.ok){
        throw new Error("Unable to load CSV");
    }

    const text = await response.text();

    return parseCSV(text);

}


/* =========================
   SIMPLE CSV PARSER
========================= */

function parseCSV(text){

    const rows = text
        .trim()
        .split(/\r?\n/)
        .map(row => row.split(","));

    const headers = rows.shift();

    return rows.map(row => {

        const object = {};

        headers.forEach((header, index) => {

            object[header.trim()] =
                (row[index] || "").trim();

        });

        return object;

    });

}


/* =========================
   CALCULATE PLAYER RECORD
========================= */

async function getPlayerRecord(player){

    const [previousWeeks, results] = await Promise.all([

        loadCSV(PREVIOUS_WEEKS_CSV),
        loadCSV(RESULTS_CSV)

    ]);


let wins = 0;
let losses = 0;

let favoriteWins = 0;
let favoriteLosses = 0;

let underdogWins = 0;
let underdogLosses = 0;

let smallWins = 0;
let smallLosses = 0;

let mediumWins = 0;
let mediumLosses = 0;

let largeWins = 0;
let largeLosses = 0;


    previousWeeks
        .filter(row => row.Player === player)
        .forEach(row => {

            const picks = [

                row["Game 1"],
                row["Game 2"],
                row["Game 3"],
                row["Game 4"],
                row["Game 5"]

            ];


            picks.forEach(pick => {

                if(!pick) return;


                const result = results.find(
                    row => row.Winner === pick
                );


                if(!result) return;


const spreadMatch =
    pick.match(/([+-]?\d+(?:\.\d+)?)/);

const spread =
    spreadMatch
        ? parseFloat(spreadMatch[1])
        : null;


if(result.Result.toUpperCase() === "W"){

    wins++;


    /* FAVORITE / UNDERDOG */

    if(spread < 0){

        favoriteWins++;

    }
    else if(spread > 0){

        underdogWins++;

    }


    /* SPREAD SIZE */

    const spreadSize = Math.abs(spread);


    if(spreadSize <= 3){

        smallWins++;

    }
    else if(spreadSize <= 6.5){

        mediumWins++;

    }
    else{

        largeWins++;

    }

}


else if(result.Result.toUpperCase() === "L"){

    losses++;


    /* FAVORITE / UNDERDOG */

    if(spread < 0){

        favoriteLosses++;

    }
    else if(spread > 0){

        underdogLosses++;

    }


    /* SPREAD SIZE */

    const spreadSize = Math.abs(spread);


    if(spreadSize <= 3){

        smallLosses++;

    }
    else if(spreadSize <= 6.5){

        mediumLosses++;

    }
    else{

        largeLosses++;

    }

}

            });

        });


const teamCounts = {};

previousWeeks
    .filter(row => row.Player === player)
    .forEach(row => {

        const picks = [
            row["Game 1"],
            row["Game 2"],
            row["Game 3"],
            row["Game 4"],
            row["Game 5"]
        ];

        picks.forEach(pick => {

            if(!pick) return;

            const team =
                pick.trim().split(/\s+/)[0].toUpperCase();

            teamCounts[team] =
                (teamCounts[team] || 0) + 1;

        });

    });


let favoriteTeam = "N/A";

const teamEntries =
    Object.entries(teamCounts);

if(teamEntries.length > 0){

    teamEntries.sort((a, b) => b[1] - a[1]);

    favoriteTeam = teamEntries[0][0];

}


return {
    wins,
    losses,
    total: wins + losses,
    favoriteTeam,

    favoriteWins,
    favoriteLosses,

    underdogWins,
    underdogLosses,

    smallWins,
    smallLosses,

    mediumWins,
    mediumLosses,

    largeWins,
    largeLosses
};

}

async function getRollingRecord(player, numberOfWeeks){

    const [previousWeeks, results] = await Promise.all([

        loadCSV(PREVIOUS_WEEKS_CSV),
        loadCSV(RESULTS_CSV)

    ]);


    /* =========================
       FIND PLAYER'S WEEKS
    ========================= */

    const playerWeeks = previousWeeks
        .filter(row => row.Player === player)
        .sort((a, b) =>
            Number(b.Week) - Number(a.Week)
        )
        .slice(0, numberOfWeeks);


    let wins = 0;
    let losses = 0;


    /* =========================
       GRADE EACH PICK
    ========================= */

    playerWeeks.forEach(row => {

        const picks = [

            row["Game 1"],
            row["Game 2"],
            row["Game 3"],
            row["Game 4"],
            row["Game 5"]

        ];


        picks.forEach(pick => {

            if(!pick) return;


            const result = results.find(
                row => row.Winner === pick
            );


            if(!result) return;


            if(result.Result.toUpperCase() === "W"){

                wins++;

            }

            else if(result.Result.toUpperCase() === "L"){

                losses++;

            }

        });

    });


    return {

        wins,
        losses

    };

}

/* =========================
   WEEKLY RECORD DISTRIBUTION
========================= */

async function getWeeklyDistribution(player){

    const [previousWeeks, results] = await Promise.all([

        loadCSV(PREVIOUS_WEEKS_CSV),
        loadCSV(RESULTS_CSV)

    ]);


    const distribution = {

        "5–0": 0,
        "4–1": 0,
        "3–2": 0,
        "2–3": 0,
        "1–4": 0,
        "0–5": 0

    };


    previousWeeks
        .filter(row => row.Player === player)
        .forEach(row => {

            const picks = [

                row["Game 1"],
                row["Game 2"],
                row["Game 3"],
                row["Game 4"],
                row["Game 5"]

            ];


            let wins = 0;
            let losses = 0;


            picks.forEach(pick => {

                if(!pick) return;


                const result = results.find(
                    row => row.Winner === pick
                );


                if(!result) return;


                if(result.Result.toUpperCase() === "W"){

                    wins++;

                }

                else if(result.Result.toUpperCase() === "L"){

                    losses++;

                }

            });


            const totalGraded =
                wins + losses;


            /* Only count completed 5-pick weeks */

            if(totalGraded !== 5) return;


            const weeklyRecord =
                `${wins}–${losses}`;


            if(distribution.hasOwnProperty(weeklyRecord)){

                distribution[weeklyRecord]++;

            }

        });


    return distribution;

}

        `;


        try {

const record =
    await getPlayerRecord(player);

const last3 =
    await getRollingRecord(player, 3);

const last5 =
    await getRollingRecord(player, 5);

const weeklyDistribution =
    await getWeeklyDistribution(player);


            const winRate =

                    : "0.0";


            profileDisplay.innerHTML = `

                            👤
                        </div>

                        <div>

                            <h2>${player.toUpperCase()}</h2>

                            <p>2026 SUPERCONTEST</p>

                        </div>

                    </div>


<!-- =========================
     ROW 1 — PRIMARY STATS
========================= -->

<div class="profile-stats-row profile-row-primary">

    <div class="player-profile-stat">

</div>

<!-- =========================

========================= -->

<div class="profile-stats-row profile-row-favorite">

        <div class="stat-number">

    </div>


    <div class="favorite-spectrum-stat">

        <div class="spectrum-title">

        </div>

        <div class="favorite-spectrum">

            <div class="spectrum-labels">

                <span>100%</span>
                <span>90%</span>
                <span>80%</span>
                <span>70%</span>
                <span>60%</span>
                <span>50%</span>
                <span>60%</span>
                <span>70%</span>
                <span>80%</span>
                <span>90%</span>
                <span>100%</span>

            </div>

            <div class="spectrum-line">

                <div class="spectrum-dot"
                     style="left:${(() => {

                         const total =
                             record.favoriteWins +
                             record.favoriteLosses +
                             record.underdogWins +
                             record.underdogLosses;

                         const favoriteTotal =
                             record.favoriteWins +
                             record.favoriteLosses;

                         if(!total) return 50;

                         const favoritePercent =
                             (favoriteTotal / total) * 100;

                         return 100 - favoritePercent;

                     })()}%;">
                </div>

            </div>

            <div class="spectrum-poles">

                <span>FAVORITES</span>

                <span>UNDERDOGS</span>

            </div>

        </div>

    </div>


    <div class="favorite-record-stat">

    </div>

</div>

<!-- =========================

========================= -->

    <!-- RIGHT — BAR GRAPH -->

</div>

                        ["0–5", weeklyDistribution["0–5"]]
                    ];

                    const maxValue =
                        Math.max(...records.map(item => item[1]), 1);

</div>


                </div>

});
