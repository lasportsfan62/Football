<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Previous SuperContest Picks</title>

<style>

body {
    font-family: Arial, sans-serif;
    background:#f7f7f7;
    margin:0;
    padding:20px;
}

.container {
    max-width:1200px;
    margin:auto;
}


/* HEADER */

.hero {

    text-align:center;
    background:#111;
    color:white;
    padding:25px;
    border-radius:15px;
    margin-bottom:20px;

}

.hero h1 {

    margin:0;
    font-size:34px;

}

.hero p {

    margin-top:10px;
    font-size:18px;

}


/* SECTION CARDS */

.section-card {

    background:white;
    border-radius:15px;
    padding:20px;
    box-shadow:0 4px 10px rgba(0,0,0,.15);
    margin-bottom:25px;

}


.section-card h2 {

    text-align:center;

}


/* DROPDOWN */

.week-selector {

    text-align:center;
    margin-bottom:20px;

}


select {

    padding:10px;
    font-size:16px;
    border-radius:8px;

}


/* TABLE */

table {

    width:100%;
    border-collapse:collapse;

}


.table-container {

    width:100%;
    overflow-x:auto;
    -webkit-overflow-scrolling:touch;

}


th {

    background:#111;
    color:white;
    padding:12px;

}


td {

    padding:12px;
    text-align:center;
    border-bottom:1px solid #ddd;
    white-space:nowrap;

}


/* RESULT COLORS */

.win-cell {

    background:#c8e6c9;
    font-weight:bold;

}


.loss-cell {

    background:#ffcdd2;
    font-weight:bold;

}


.tie-cell {

    background:#e0e0e0;
    font-weight:bold;

}


/* MOBILE */

@media(max-width:700px){

.hero h1 {

    font-size:26px;

}


table {

    font-size:13px;

}

}

</style>

</head>


<body>


<div class="container">


<div class="hero">

<h1>🏈 Previous SuperContest Picks</h1>

<p>Review Past Weeks</p>

</div>



<div class="section-card">


<h2>📅 Select Week</h2>


<div class="week-selector">


<select id="weekSelect">

<option>Loading Weeks...</option>

</select>


</div>


</div>




<div class="section-card">


<h2 id="weekTitle">Week Picks</h2>


<div class="table-container">


<table id="previousPicksTable">


<tr>

<th>Player</th>
<th>Game 1</th>
<th>Game 2</th>
<th>Game 3</th>
<th>Game 4</th>
<th>Game 5</th>
<th>Score</th>

</tr>


</table>


</div>


</div>


</div>



<script>


// CSV CONNECTION WILL BE ADDED NEXT STEP


</script>


</body>

</html>
